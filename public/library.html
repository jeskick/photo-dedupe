<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>照片</title>
  <link rel="stylesheet" href="/library.css">
</head>
<body>
  <aside class="nav">
    <div class="mode">
      <button id="nav-all" class="nav-item on" type="button">照片</button>
      <button id="nav-video" class="nav-item" type="button">视频</button>
    </div>
    <section class="fold open" data-fold="time">
      <button class="fold-head" type="button" aria-expanded="true">
        <span>时间</span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div id="tree" class="tree fold-body"></div>
    </section>
    <section class="fold open" data-fold="origin">
      <button class="fold-head" type="button" aria-expanded="true">
        <span>来源</span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="fold-body">
        <div id="origins" class="ratings" role="group" aria-label="按拍摄来源查看">
          <button type="button" data-origin="camera">相机</button>
          <button type="button" data-origin="phone">手机</button>
        </div>
      </div>
    </section>
    <section class="fold open" data-fold="marks">
      <button class="fold-head" type="button" aria-expanded="true">
        <span>标记</span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="fold-body">
        <div id="scenes" class="ratings" role="group" aria-label="按识别结果查看">
          <button type="button" data-label="person">人物</button>
          <button type="button" data-label="animal">动物</button>
          <button type="button" data-label="landscape">风景</button>
        </div>
        <button id="recognize" type="button">识别全部照片</button>
        <button id="recognize-stop" type="button" hidden>停止识别</button>
        <p id="recognize-status" class="hint"></p>
        <div id="face-editor" class="face-names"></div>
        <div id="names" class="names"></div>
        <p class="hint">先把没人的照片标成风景，再只对有人的照片认脸。点一组起名后，再识别会自动标上。</p>
      </div>
    </section>
    <section class="fold open" data-fold="rating">
      <button class="fold-head" type="button" aria-expanded="true">
        <span>星级</span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="fold-body">
        <div id="ratings" class="ratings" role="group" aria-label="按星级查看">
          <button type="button" data-rating="1">1星</button>
          <button type="button" data-rating="2">2星</button>
          <button type="button" data-rating="3">3星</button>
          <button type="button" data-rating="4">4星</button>
          <button type="button" data-rating="5">5星</button>
        </div>
      </div>
    </section>
    <section class="fold" data-fold="scan">
      <button class="fold-head" type="button" aria-expanded="false">
        <span>扫描</span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="fold-body nav-foot">
        <p id="count">还没有照片</p>
        <label class="scan-line">长边小于
          <select id="min-edge" aria-label="小于多少像素不收录">
            <option value="0">不限制</option>
            <option value="120">120</option>
            <option value="240">240</option>
            <option value="360">360</option>
            <option value="480">480</option>
          </select>
          不收录
        </label>
        <ul id="exclude-list" class="exclude"></ul>
        <button id="exclude-add" class="quiet link" type="button">添加不扫描的目录</button>
        <p class="scan-note">下次扫描才生效。</p>
        <button id="scan" type="button">扫描全部磁盘</button>
        <button id="stop" class="quiet" type="button" hidden>停止</button>
        <p id="scan-status" class="hint"></p>
      </div>
    </section>
  </aside>
  <div class="main">
    <header class="top">
      <input id="search" type="search" placeholder="搜索文件名" aria-label="搜索文件名">
    </header>
    <div id="stage" class="stage">
      <div id="mosaic" class="mosaic"></div>
    </div>
    <div id="scrub" class="scrub" aria-hidden="true">
      <div id="scrub-label" class="scrub-label" hidden></div>
      <div id="scrub-track" class="scrub-track"></div>
    </div>
  </div>
  <div id="viewer" class="viewer" hidden>
    <div class="viewer-bar">
      <button id="viewer-close" class="quiet" type="button">关闭</button>
      <div id="viewer-caption"></div>
      <button id="viewer-open" class="quiet" type="button">打开所在文件夹</button>
    </div>
    <div class="viewer-stage">
      <aside id="viewer-info" class="viewer-info" hidden></aside>
      <button id="viewer-prev" class="quiet edge" type="button" aria-label="上一张">‹</button>
      <img id="viewer-img" alt="" draggable="false">
      <video id="viewer-video" hidden controls playsinline></video>
      <button id="viewer-next" class="quiet edge" type="button" aria-label="下一张">›</button>
    </div>
  </div>
  <script src="/library.js"></script>
</body>
</html>
